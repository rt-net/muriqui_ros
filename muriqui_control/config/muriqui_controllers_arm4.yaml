controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    right_arm_controller:
      type: position_controllers/JointGroupPositionController
    left_arm_controller:
      type: position_controllers/JointGroupPositionController
    right_leg_controller:
      type: position_controllers/JointGroupPositionController
    left_leg_controller:
      type: position_controllers/JointGroupPositionController
    neck_controller:
      type: position_controllers/JointGroupPositionController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

right_arm_controller:
  ros__parameters:
    joints:
      - r_arm_joint1
      - r_arm_joint2
      - r_arm_joint3
      - r_arm_joint_add4

left_arm_controller:
  ros__parameters:
    joints:
      - l_arm_joint1
      - l_arm_joint2
      - l_arm_joint3
      - l_arm_joint_add4

right_leg_controller:
  ros__parameters:
    joints:
      - r_leg_joint1
      - r_leg_joint2
      - r_leg_joint3
      - r_leg_joint4
      - r_leg_joint5
      - r_leg_joint6

left_leg_controller:
  ros__parameters:
    joints:
      - l_leg_joint1
      - l_leg_joint2
      - l_leg_joint3
      - l_leg_joint4
      - l_leg_joint5
      - l_leg_joint6

neck_controller:
  ros__parameters:
    joints:
      - neck_joint1
      - neck_joint2
